name = "bh10-buzon"
main = "src/index.js"
compatibility_date = "2026-09-11"

# Buzón de correo: cada mañana a las 08:00 (hora peninsular) recoge las facturas
# que llegan por Gmail y las deja en el buzón de la app, pendientes de revisar.
[triggers]
crons = ["0 6 * * *"]

# Secretos (wrangler secret put o panel de Cloudflare):
#   SA_JSON              cuenta de servicio de Firebase
#   GMAIL_CLIENT_SECRET  secreto del cliente OAuth de la app (Google Cloud → Credenciales)
[vars]
FIREBASE_PROJECT = "b10h-facturas"
