<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conectar buzón Gmail · BH10</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f6f7f9;--tx:#1b1f24;--mt:#6b7280;--sc:#0a7a3c;--dn:#b91c1c;--bd:#e5e7eb;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--tx:#e6e8eb;--mt:#9aa1ab;--bd:#2a2f38;--card:#171a20}}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  main{max-width:520px;margin:32px auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px}
  h1{font-size:18px;margin:0 0 8px} p{margin:8px 0;color:var(--mt)} b{color:var(--tx)}
  button{margin-top:12px;background:#111;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:15px;cursor:pointer;width:100%}
  button:disabled{opacity:.5;cursor:default}
  #res{margin-top:14px;padding:12px;border-radius:8px;display:none;white-space:pre-wrap;word-break:break-word}
  .ok{display:block!important;background:#e7f6ed;color:var(--sc)} .ko{display:block!important;background:#fdecec;color:var(--dn)}
</style>
</head>
<body>
<main>
  <h1>Conectar el buzón de correo</h1>
  <p>Autoriza <b>una sola vez</b> a la app a leer los adjuntos de <b>greenbighouse@gmail.com</b> (solo lectura). Cada mañana las facturas que lleguen por correo aparecerán en el buzón de FacturaControl.</p>
  <p>Cuando Google pregunte, elige la cuenta <b>greenbighouse@gmail.com</b> y acepta.</p>
  <button id="btn" disabled>Cargando Google…</button>
  <div id="res"></div>
</main>
<script>
  const CLIENT_ID='1075389182399-lgeqgnhbvj4okk7gj67iecbeji1255ku.apps.googleusercontent.com';
  const WORKER='https://bh10-buzon.jesacam.workers.dev/callback';
  const CUENTA='greenbighouse@gmail.com';
  const btn=document.getElementById('btn'), res=document.getElementById('res');
  const pinta=(cls,txt)=>{res.className=cls;res.textContent=txt;};
  function listo(){
    btn.disabled=false; btn.textContent='Conectar '+CUENTA;
    const cli=google.accounts.oauth2.initCodeClient({
      client_id:CLIENT_ID, scope:'https://www.googleapis.com/auth/gmail.readonly', ux_mode:'popup',
      access_type:'offline', prompt:'consent', hint:CUENTA, include_granted_scopes:false,
      callback:async(r)=>{
        if(!r||!r.code){pinta('ko','Google no devolvió el permiso'+(r&&r.error?': '+r.error:'')+'.');return;}
        btn.disabled=true; btn.textContent='Guardando…';
        try{
          const x=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:r.code})});
          const d=await x.json().catch(()=>({error:'respuesta no válida del Worker ('+x.status+')'}));
          if(x.ok&&d.ok){pinta('ok','✅ Buzón conectado con '+d.cuenta+'. Mañana a las 08:00 se hará la primera recogida; puedes cerrar esta página.');btn.textContent='Conectado';}
          else{pinta('ko','No se pudo guardar: '+(d.error||x.status)+(d.detalle?'\n'+d.detalle:''));btn.disabled=false;btn.textContent='Volver a intentar';}
        }catch(e){pinta('ko','Error de red: '+e.message);btn.disabled=false;btn.textContent='Volver a intentar';}
      },
      error_callback:(e)=>pinta('ko','Google: '+(e&&e.type||'error')+(e&&e.message?' · '+e.message:''))
    });
    btn.onclick=()=>cli.requestCode();
  }
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.onload=listo;
  s.onerror=()=>pinta('ko','No se pudo cargar Google Identity Services.'); document.head.appendChild(s);
</script>
</body>
</html>
